name: Sync Model Pricing

on:
  push:
    branches: [main]
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-pricing
  cancel-in-progress: false

jobs:
  sync-pricing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pricing synchronization
        run: |
          python3 -m unittest discover -s tests -v
      - name: Restore official source cache
        uses: actions/cache@v4
        with:
          path: .cache/official-sources
          key: official-pricing-sources-${{ github.run_id }}
          restore-keys: official-pricing-sources-
      - name: Sync LiteLLM and official into the compatible USD catalog
        id: sync
        run: |
          python3 scripts/sync_prices.py --config config.json --repo-root . --official-config official-prices.json > sync-result.txt
          cat sync-result.txt
          sed -n 's/^CHANGED=/changed=/p' sync-result.txt >> "$GITHUB_OUTPUT"
      - name: Upload synchronization report
        uses: actions/upload-artifact@v4
        with:
          name: pricing-sync-report
          path: sync-result.txt
          retention-days: 14
      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model_prices_and_context_window.json model_prices_and_context_window.sha256
          git commit -m "chore: sync LiteLLM and official pricing"
          git push
